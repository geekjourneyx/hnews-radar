<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">HNews Radar</title>
  <desc id="desc">Hacker News signals flow through discovery, verification and daily archival at 10:00, 14:00 and 19:00.</desc>

  <rect width="1200" height="400" rx="28" fill="#0B0B0C"/>
  <rect x="1" y="1" width="1198" height="398" rx="27" fill="none" stroke="#242426"/>

  <g id="title-block" transform="translate(64 58)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="0" y="0" fill="#FF6600" font-size="18" font-weight="700" letter-spacing="2">HACKER NEWS · HIGH-SIGNAL RESEARCH</text>
    <text x="0" y="70" fill="#F5F5F4" font-size="64" font-weight="760">HNews Radar</text>
    <text x="0" y="116" fill="#A7A7AA" font-size="24">Discover signal. Verify claims. Archive what matters.</text>

    <g transform="translate(0 164)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">
      <rect x="0" y="0" width="152" height="40" rx="8" fill="#151516" stroke="#303033"/>
      <text x="18" y="26" fill="#D4D4D8">newest</text>
      <rect x="166" y="0" width="172" height="40" rx="8" fill="#151516" stroke="#303033"/>
      <text x="184" y="26" fill="#D4D4D8">frontpage</text>
      <rect x="352" y="0" width="190" height="40" rx="8" fill="#151516" stroke="#303033"/>
      <text x="370" y="26" fill="#D4D4D8">bestcomments</text>
    </g>

    <g transform="translate(0 232)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
      <text x="0" y="0" fill="#71717A">signal value</text>
      <text x="128" y="0" fill="#FF6600">&gt;</text>
      <text x="153" y="0" fill="#71717A">HN points</text>
    </g>
  </g>

  <g id="signal-flow" transform="translate(655 52)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect x="0" y="0" width="481" height="296" rx="22" fill="#111112" stroke="#2A2A2D"/>

    <text x="28" y="38" fill="#A7A7AA" font-size="16" font-weight="700" letter-spacing="1.4">DAILY SIGNAL PIPELINE</text>

    <g transform="translate(28 68)">
      <circle cx="12" cy="12" r="8" fill="#FF6600"/>
      <text x="36" y="19" fill="#F4F4F5" font-size="21" font-weight="650">Discover</text>
      <text x="144" y="19" fill="#71717A" font-size="18">HN + HNRSS</text>

      <path d="M12 32 L12 58" stroke="#3F3F46" stroke-width="2"/>

      <circle cx="12" cy="80" r="8" fill="#FF6600"/>
      <text x="36" y="87" fill="#F4F4F5" font-size="21" font-weight="650">Verify</text>
      <text x="144" y="87" fill="#71717A" font-size="18">primary + web evidence</text>

      <path d="M12 100 L12 126" stroke="#3F3F46" stroke-width="2"/>

      <circle cx="12" cy="148" r="8" fill="#FF6600"/>
      <text x="36" y="155" fill="#F4F4F5" font-size="21" font-weight="650">Archive</text>
      <text x="144" y="155" fill="#71717A" font-size="18">one report / day</text>
    </g>

    <g transform="translate(28 238)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
      <rect x="0" y="0" width="112" height="34" rx="7" fill="#19191B" stroke="#343438"/>
      <text x="24" y="22" fill="#D4D4D8">10:00</text>
      <path d="M120 17 L148 17" stroke="#52525B" stroke-width="2"/>
      <rect x="156" y="0" width="112" height="34" rx="7" fill="#19191B" stroke="#343438"/>
      <text x="180" y="22" fill="#D4D4D8">14:00</text>
      <path d="M276 17 L304 17" stroke="#52525B" stroke-width="2"/>
      <rect x="312" y="0" width="112" height="34" rx="7" fill="#FF6600"/>
      <text x="336" y="22" fill="#101010" font-weight="700">19:00</text>
    </g>
  </g>

  <g transform="translate(655 364)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <text x="0" y="0" fill="#71717A">reports/YYYY/MM/DD.md · evidence-first · idempotent updates</text>
  </g>
</svg>
